<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Modelo 3D PSQI</title>

<style>

html,
body {
    width: 100%;
    height: 100%;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    background: transparent !important;
}

body {
    position: relative;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;

    width: 100% !important;
    height: 100% !important;

    display: block !important;

    margin: 0 !important;
    padding: 0 !important;
}

</style>

</head>

<body>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from 'three';

import {
    STLLoader
} from 'three/addons/loaders/STLLoader.js';


/* =========================
   CENA
========================= */

const scene =
    new THREE.Scene();


/* =========================
   CÂMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(
        32,
        window.innerWidth /
        window.innerHeight,
        0.1,
        10000
    );


/* =========================
   RENDER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setClearColor(
    0x000000,
    0
);

document.body.appendChild(
    renderer.domElement
);


/* =========================
   ILUMINAÇÃO
========================= */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        0.65
    );

scene.add(ambient);


const mainLight =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

mainLight.position.set(
    4,
    6,
    8
);

scene.add(mainLight);


const sideLight =
    new THREE.DirectionalLight(
        0xffffff,
        1.2
    );

sideLight.position.set(
    -5,
    2,
    4
);

scene.add(sideLight);


const fillLight =
    new THREE.DirectionalLight(
        0xffffff,
        0.7
    );

fillLight.position.set(
    0,
    -5,
    3
);

scene.add(fillLight);


/* =========================
   GRUPOS
========================= */

const rotationGroup =
    new THREE.Group();

scene.add(rotationGroup);


/* posição inicial 180 graus */
rotationGroup.rotation.y =
    THREE.MathUtils.degToRad(180);


const orientationGroup =
    new THREE.Group();

rotationGroup.add(
    orientationGroup
);


/* orientação do STL */

orientationGroup.rotation.x =
    THREE.MathUtils.degToRad(-90);

orientationGroup.rotation.y = 0;

orientationGroup.rotation.z =
    THREE.MathUtils.degToRad(180);


/* =========================
   STL
========================= */

const loader =
    new STLLoader();


loader.load(

    './coroa%20reduzida%2021%20com%20palatina.stl',

    function (geometry) {

        geometry.computeVertexNormals();
        geometry.center();


        const material =
            new THREE.MeshStandardMaterial({

                color: 0xd2d0ca,

                roughness: 0.62,

                metalness: 0,

                side: THREE.DoubleSide

            });


        const model =
            new THREE.Mesh(
                geometry,
                material
            );


        orientationGroup.add(
            model
        );


        /* =====================
           TAMANHO DO MODELO
        ===================== */

        geometry.computeBoundingBox();

        const size =
            new THREE.Vector3();

        geometry.boundingBox.getSize(
            size
        );

        const maxDim =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        /* distância da câmera */

        camera.position.set(
            0,
            0,
            maxDim * 2.0
        );

        camera.near =
            maxDim / 100;

        camera.far =
            maxDim * 100;

        camera.updateProjectionMatrix();

        camera.lookAt(
            0,
            0,
            0
        );

    }

);


/* =========================
   REDIMENSIONAMENTO
========================= */

function resize() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    camera.aspect =
        width / height;

    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height,
        false
    );

}

window.addEventListener(
    'resize',
    resize
);


/* =========================
   ANIMAÇÃO
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    /* VELOCIDADE DO GIRO */

    rotationGroup.rotation.y +=
        0.015;


    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
