<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PSQI 3D</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

#viewer {
    width: 100vw;
    height: 100vh;
}

canvas {
    display: block;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="viewer"></div>

<script type="module">

import * as THREE from 'three';


const PLY_URL =
'./2026-08-05_100_026-UpperJaw.ply';

const TEXTURE_URL =
'./2026-08-05_100_026-UpperJaw.jpg';


/* =========================
   CENA
========================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.1,
    10000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setClearColor(0x000000, 0);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById('viewer')
    .appendChild(renderer.domElement);


/* =========================
   ILUMINAÇÃO
========================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.8
    )
);

const luz1 =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

luz1.position.set(5, 5, 10);

scene.add(luz1);


const luz2 =
    new THREE.DirectionalLight(
        0xffffff,
        1.2
    );

luz2.position.set(-5, 2, 5);

scene.add(luz2);


/* =========================
   CARREGAR PLY
========================= */

async function carregarModelo() {

    const response =
        await fetch(PLY_URL);

    if (!response.ok) {
        throw new Error(
            'Erro ao carregar PLY'
        );
    }

    const buffer =
        await response.arrayBuffer();

    const bytes =
        new Uint8Array(buffer);


    /* Encontrar final do cabeçalho */

    const decoder =
        new TextDecoder('ascii');

    const inicio =
        decoder.decode(
            bytes.subarray(0, 5000)
        );

    const end =
        inicio.indexOf('end_header');

    if (end === -1) {
        throw new Error(
            'Cabeçalho PLY inválido'
        );
    }


    let offset =
        end + 'end_header'.length;

    while (
        bytes[offset] === 10 ||
        bytes[offset] === 13
    ) {
        offset++;
    }


    const view =
        new DataView(buffer);


    /* =========================
       DADOS REAIS DO SEU PLY
    ========================= */

    const vertexCount = 222148;
    const faceCount   = 438731;


    /*
       Cada vértice possui:

       x
       y
       z
       nx
       ny
       nz

       6 floats = 24 bytes
    */


    const vertices =
        new Float32Array(
            vertexCount * 3
        );


    for (
        let i = 0;
        i < vertexCount;
        i++
    ) {

        const base = i * 3;


        /* XYZ */

        vertices[base] =
            view.getFloat32(
                offset,
                true
            );

        offset += 4;


        vertices[base + 1] =
            view.getFloat32(
                offset,
                true
            );

        offset += 4;


        vertices[base + 2] =
            view.getFloat32(
                offset,
                true
            );

        offset += 4;


        /*
           NX NY NZ

           Precisamos avançar 12 bytes.
           Não precisamos armazená-los,
           pois recalcularemos as normais.
        */

        offset += 12;
    }


    /* =========================
       TRIÂNGULOS + UV
    ========================= */


    /*
       Seu arquivo possui aproximadamente
       438 mil triângulos.

       Já reservamos a memória.
    */

    const positions =
        new Float32Array(
            faceCount * 9
        );

    const uvs =
        new Float32Array(
            faceCount * 6
        );


    let positionPointer = 0;
    let uvPointer = 0;

    let triangulos = 0;


    for (
        let f = 0;
        f < faceCount;
        f++
    ) {

        /* quantidade de vértices */

        const qtdIndices =
            view.getUint8(offset);

        offset += 1;


        const indices = [];

        for (
            let i = 0;
            i < qtdIndices;
            i++
        ) {

            indices.push(
                view.getInt32(
                    offset,
                    true
                )
            );

            offset += 4;
        }


        /* quantidade de floats UV */

        const qtdUV =
            view.getUint8(offset);

        offset += 1;


        const texcoords = [];

        for (
            let i = 0;
            i < qtdUV;
            i++
        ) {

            texcoords.push(
                view.getFloat32(
                    offset,
                    true
                )
            );

            offset += 4;
        }


        /*
           Nosso caso:
           triângulo = 3 índices
           UV = 6 floats
        */

        if (
            qtdIndices === 3 &&
            qtdUV >= 6
        ) {

            for (
                let i = 0;
                i < 3;
                i++
            ) {

                const vertexIndex =
                    indices[i] * 3;


                positions[
                    positionPointer++
                ] =
                    vertices[
                        vertexIndex
                    ];


                positions[
                    positionPointer++
                ] =
                    vertices[
                        vertexIndex + 1
                    ];


                positions[
                    positionPointer++
                ] =
                    vertices[
                        vertexIndex + 2
                    ];


                uvs[
                    uvPointer++
                ] =
                    texcoords[
                        i * 2
                    ];


                uvs[
                    uvPointer++
                ] =
                    texcoords[
                        i * 2 + 1
                    ];

            }

            triangulos++;

        }

    }


    console.log(
        'Triângulos:',
        triangulos
    );


    /* =========================
       GEOMETRIA
    ========================= */

    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    geometry.setAttribute(
        'uv',
        new THREE.BufferAttribute(
            uvs,
            2
        )
    );


    geometry.computeVertexNormals();

    geometry.computeBoundingBox();

    geometry.center();


    /* =========================
       TEXTURA
    ========================= */

    const texture =
        await new THREE.TextureLoader()
        .loadAsync(TEXTURE_URL);


    texture.colorSpace =
        THREE.SRGBColorSpace;


    /*
       MUITO IMPORTANTE
       para esse tipo de PLY.
    */

    texture.flipY = false;


    texture.wrapS =
        THREE.ClampToEdgeWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;


    /* =========================
       MATERIAL
    ========================= */

    const material =
        new THREE.MeshStandardMaterial({

            map: texture,

            roughness: 0.8,

            metalness: 0,

            side: THREE.DoubleSide

        });


    const model =
        new THREE.Mesh(
            geometry,
            material
        );


    scene.add(model);


    /* =========================
       CÂMERA
    ========================= */

    const box =
        new THREE.Box3()
        .setFromObject(model);


    const size =
        new THREE.Vector3();

    box.getSize(size);


    const maxDim =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    camera.position.set(
        0,
        0,
        maxDim * 1.8
    );


    camera.near =
        maxDim / 100;

    camera.far =
        maxDim * 100;

    camera.updateProjectionMatrix();

    camera.lookAt(0,0,0);


    /* pequena inclinação */

    model.rotation.x =
        THREE.MathUtils
        .degToRad(-10);


    /* =========================
       GIRAR SOZINHO
    ========================= */

    function animate() {

        requestAnimationFrame(
            animate
        );


        model.rotation.y +=
            0.004;


        renderer.render(
            scene,
            camera
        );

    }


    animate();

}


/* INICIAR */

carregarModelo()

.catch(error => {

    console.error(error);

    document.body.innerHTML +=
        '<div style="color:red;position:absolute;top:20px;left:20px;font-family:Arial;">Erro ao carregar modelo 3D. Abra o console.</div>';

});


/* RESPONSIVO */

window.addEventListener(
    'resize',
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
