<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Modelo 3D PSQI</title>

<style>

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

</style>
</head>


<body>


<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from 'three';

import {
    STLLoader
} from 'three/addons/loaders/STLLoader.js';



/* =====================================================
   CONFIGURAÇÕES FÁCEIS DE ALTERAR
===================================================== */


/* velocidade da rotação */

const VELOCIDADE = 0.015;


/*
   ENQUADRAMENTO

   menor número = dente maior
   maior número = dente menor

   2.05 = quase rente
   2.10 = pouco espaço
   2.15 = recomendado
   2.20 = mais espaço
   2.30 = bastante espaço
*/

const ENQUADRAMENTO = 2.15;


/*
   posição inicial da rotação
   180 = lado oposto ao original
*/

const ANGULO_INICIAL = 180;



/* =====================================================
   CENA
===================================================== */

const scene =
    new THREE.Scene();



/* =====================================================
   CÂMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        32,
        window.innerWidth /
        window.innerHeight,
        0.1,
        10000
    );



/* =====================================================
   RENDERIZADOR
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: true

    });


renderer.setPixelRatio(

    Math.min(

        window.devicePixelRatio,

        2

    )

);


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.setClearColor(

    0x000000,

    0

);


document.body.appendChild(

    renderer.domElement

);



/* =====================================================
   ILUMINAÇÃO
===================================================== */


/* luz geral */

const ambientLight =
    new THREE.AmbientLight(

        0xffffff,

        0.65

    );

scene.add(

    ambientLight

);



/* luz principal */

const mainLight =
    new THREE.DirectionalLight(

        0xffffff,

        2.2

    );


mainLight.position.set(

    4,

    6,

    8

);


scene.add(

    mainLight

);



/* luz lateral */

const sideLight =
    new THREE.DirectionalLight(

        0xffffff,

        1.2

    );


sideLight.position.set(

    -5,

    2,

    4

);


scene.add(

    sideLight

);



/* luz inferior */

const fillLight =
    new THREE.DirectionalLight(

        0xffffff,

        0.7

    );


fillLight.position.set(

    0,

    -5,

    3

);


scene.add(

    fillLight

);



/* =====================================================
   GRUPO RESPONSÁVEL PELO GIRO
===================================================== */

const rotationGroup =
    new THREE.Group();


scene.add(

    rotationGroup

);


/* posição inicial */

rotationGroup.rotation.y =

    THREE.MathUtils.degToRad(

        ANGULO_INICIAL

    );



/* =====================================================
   GRUPO RESPONSÁVEL PELA ORIENTAÇÃO DO DENTE
===================================================== */

const orientationGroup =
    new THREE.Group();


rotationGroup.add(

    orientationGroup

);


/* orientação correta do STL */

orientationGroup.rotation.x =

    THREE.MathUtils.degToRad(-90);


orientationGroup.rotation.y = 0;


orientationGroup.rotation.z =

    THREE.MathUtils.degToRad(180);



/* =====================================================
   CARREGAMENTO DO STL
===================================================== */

const loader =
    new STLLoader();


loader.load(

    './coroa%20reduzida%2021%20com%20palatina.stl',


    function (geometry) {


        /* melhora a iluminação da superfície */

        geometry.computeVertexNormals();


        /* coloca o modelo no centro */

        geometry.center();



        /* MATERIAL */

        const material =
            new THREE.MeshStandardMaterial({

                color: 0xd2d0ca,

                roughness: 0.62,

                metalness: 0,

                side: THREE.DoubleSide

            });



        /* MODELO */

        const model =
            new THREE.Mesh(

                geometry,

                material

            );


        orientationGroup.add(

            model

        );



        /* =================================================
           CALCULA O TAMANHO DO STL
        ================================================= */


        geometry.computeBoundingBox();


        const size =
            new THREE.Vector3();


        geometry.boundingBox.getSize(

            size

        );


        const maxDim =
            Math.max(

                size.x,

                size.y,

                size.z

            );



        /* =================================================
           ENQUADRAMENTO
        ================================================= */


        camera.position.set(

            0,

            0,

            maxDim * ENQUADRAMENTO

        );


        camera.near =

            maxDim / 100;


        camera.far =

            maxDim * 100;


        camera.updateProjectionMatrix();


        camera.lookAt(

            0,

            0,

            0

        );


    },


    undefined,


    function (error) {

        console.error(

            'Erro ao carregar STL:',

            error

        );

    }

);



/* =====================================================
   AJUSTE AUTOMÁTICO AO TAMANHO DA HOTMART
===================================================== */

function resize() {


    const width =
        window.innerWidth;


    const height =
        window.innerHeight;



    camera.aspect =

        width / height;


    camera.updateProjectionMatrix();



    renderer.setSize(

        width,

        height,

        false

    );

}


window.addEventListener(

    'resize',

    resize

);



/* =====================================================
   ANIMAÇÃO
===================================================== */

function animate() {


    requestAnimationFrame(

        animate

    );


    /* rotação automática */

    rotationGroup.rotation.y +=

        VELOCIDADE;


    renderer.render(

        scene,

        camera

    );

}


animate();


</script>

</body>

</html>
